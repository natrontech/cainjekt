name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.0

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Vet
        run: make vet

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Helm lint
        run: helm lint charts/cainjekt

      - name: Helm template (default)
        run: helm template test charts/cainjekt --set caBundle="test-cert"

      - name: Helm template (full monitoring)
        run: |
          helm template test charts/cainjekt \
            --set caBundle="test-cert" \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set grafanaDashboard.enabled=true \
            --set podDisruptionBudget.enabled=true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: cainjekt:ci-test
          cache-from: type=gha,scope=cainjekt
          cache-to: type=gha,mode=max,scope=cainjekt

      - name: Build installer Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: installer
          load: true
          push: false
          tags: cainjekt-installer:ci-test
          cache-from: |
            type=gha,scope=cainjekt-installer
            type=gha,scope=cainjekt
          cache-to: type=gha,mode=max,scope=cainjekt-installer

      - name: Test Docker images
        run: |
          docker run --rm cainjekt:ci-test --help || true
          docker inspect cainjekt:ci-test --format='{{.Config.Entrypoint}}'
          docker inspect cainjekt:ci-test --format='Size: {{.Size}} bytes'
          docker inspect cainjekt-installer:ci-test --format='Size: {{.Size}} bytes'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-test, docker]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.3

      - name: Create kind cluster
        run: make prepare-test-cluster

      - name: Build and load images
        run: make kind-load

      - name: Integration tests (TLS)
        run: make integration-test

      - name: E2E tests (kustomize + Helm + advanced)
        run: make e2e-test

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== DaemonSet status ==="
          kubectl get daemonset -n kube-system -o wide || true
          echo "=== Pods ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=cainjekt -o wide || true
          kubectl get pods -n kube-system -l app=cainjekt -o wide || true
          echo "=== Pod logs ==="
          kubectl logs -n kube-system -l app.kubernetes.io/name=cainjekt --tail=100 --all-containers=true || true
          kubectl logs -n kube-system -l app=cainjekt --tail=100 --all-containers=true || true
          echo "=== Helm releases ==="
          helm list -n kube-system || true
          echo "=== Events ==="
          kubectl get events -n kube-system --sort-by=.metadata.creationTimestamp | tail -30 || true
